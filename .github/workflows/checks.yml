name: Checks

# The shop's server pulls its own updates every few minutes, so this does not deploy -- it says
# whether what is on main is fit to be pulled. The box checks the build succeeded before it
# restarts anything, so a red run here means "fix it", not "the shop is down".
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
