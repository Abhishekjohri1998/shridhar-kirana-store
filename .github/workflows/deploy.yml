name: Deploy to the shop's server

# Every push to main lands on the box. The tests run first and a failure stops the deploy, so a
# broken commit cannot reach the counter just because it was pushed.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # One deploy at a time. Two overlapping `npm ci` runs in the same directory is a good way to
  # leave the shop with half a node_modules.
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Run the checks
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Unlock the SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned on the first deploy rather than blindly accepted every time.
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Pull, build, restart
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            ubuntu@"${{ secrets.EC2_HOST }}" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /opt/shridhar
          git pull --ff-only
          npm ci --no-audit --no-fund
          npm run build
          # Fail before restarting rather than take the shop down for a build that did not finish.
          test -f server/dist/index.js
          test -f client/dist/index.html
          sudo systemctl restart shridhar
          REMOTE

      - name: Check the shop is actually serving
        run: |
          sleep 5
          for attempt in 1 2 3 4 5; do
            body="$(curl -fsS --max-time 10 "https://${{ secrets.EC2_HOST }}/api/health" || true)"
            case "$body" in
              *'"storage":"mongo"'*)
                echo "Live: $body"
                exit 0 ;;
              *'"storage":"file"'*)
                echo "::error::The server is writing bills to a JSON file, not Atlas. Check MONGO_URI and Atlas Network Access."
                exit 1 ;;
            esac
            echo "No answer yet (attempt $attempt)"; sleep 6
          done
          echo "::error::The server did not come back after the restart."
          exit 1
